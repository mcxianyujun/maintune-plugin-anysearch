name: CI

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public SDK
        run: python -m pip install git+https://github.com/mcxianyujun/maintune-plugin-sdk.git
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build package
        run: python build_mtp.py
      - name: Inspect package
        run: python -c "import zipfile; p='dist/maintune-plugin-anysearch-0.1.0.mtp'; z=zipfile.ZipFile(p); assert len(z.namelist()) == 6; assert z.testzip() is None"
